<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title> MATNEX | Forgot Password</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Arial, sans-serif;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;

    background:linear-gradient(
        135deg,
        #dcecff,
        #e8e2f4,
        #f3dce8
    );
}

.forgot-container{
    width:420px;
    padding:40px 45px;
    text-align:center;

    background:rgba(255,255,255,0.45);
    border-radius:12px;

    box-shadow:0 10px 30px rgba(0,0,0,0.15);
}

.icon{
    width:65px;
    height:65px;
    margin:0 auto 20px;

    background:#123456;
    color:white;

    border-radius:50%;

    display:flex;
    align-items:center;
    justify-content:center;

    font-size:28px;
}

h1{
    color:#123456;
    font-size:30px;
    margin-bottom:12px;
}

.subtitle{
    color:#64748b;
    font-size:14px;
    line-height:1.6;
    margin-bottom:25px;
}

.input-box{
    margin:20px 0;
}

.input-box input{
    width:100%;
    padding:14px 5px;

    border:none;
    border-bottom:2px solid #64748b;

    outline:none;
    background:transparent;

    font-size:14px;
}

.input-box input:focus{
    border-bottom:2px solid #123456;
}

button{
    width:100%;
    padding:14px;

    border:none;

    background:#123456;
    color:white;

    font-size:12px;
    font-weight:bold;

    letter-spacing:1px;

    cursor:pointer;
}

button:hover{
    background:#1e4f7a;
}

.back-login{
    margin-top:25px;
    font-size:14px;
    color:#64748b;
}

.back-login a{
    color:#123456;
    text-decoration:none;
    font-weight:bold;
}

.project-name{
    margin-top:25px;
    padding-top:15px;

    border-top:1px solid #cbd5e1;

    font-size:11px;
    line-height:1.6;

    color:#64748b;
}

@media(max-width:500px){

    .forgot-container{
        width:90%;
        padding:35px 25px;
    }

}

</style>
</head>

<body>

<div class="forgot-container">

    <div class="icon">
        🔒
    </div>

    <h1>Forgot Password?</h1>

    <p class="subtitle">
        Enter your registered email address.
        We will help you reset your password.
    </p>


    <form onsubmit="resetPassword(event)">

        <div class="input-box">

            <input
                type="email"
                placeholder="Enter your Email ID"
                required
            >

        </div>


        <button type="submit">

            SEND RESET LINK

        </button>

    </form>


    <div class="back-login">

        Remember your password?

        <a href="index.html">

            Back to Login

        </a>

    </div>


    <div class="project-name">

        <b>MaterialSync AI | SIH26099</b>

        <br>

        AI-Driven Standardization and Harmonization
        of Material Codes Across CPSEs

    </div>

</div>


<script>

function resetPassword(event){

    event.preventDefault();

    alert(
        "Password reset link has been sent successfully!"
    );

    window.location.href = "index.html";

}

</script>

</body>
</html>
